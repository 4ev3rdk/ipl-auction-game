<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL Auction Game</title>
    <link rel="stylesheet" href="styles.css">
    <script src="./js.js" defer></script>
</head>

<body>
    <header>
        <h1>IPL AUCTION</h1>
        <p>BUILD YOUR LEGACY</p>
    </header>

    <main class="container">
        <section id="team-selection">
            <h2>Select Your Franchise</h2>
            <p class="subtitle">Take charge of the auction.</p>

            <section class="teams">
                <button class="team" data-team="CSK"><span>Chennai Super Kings</span></button>
                <button class="team" data-team="MI"><span>Mumbai Indians</span></button>
                <button class="team" data-team="RCB"><span>Royal Challengers Bengaluru</span></button>
                <button class="team" data-team="KKR"><span>Kolkata Knight Riders</span></button>
                <button class="team" data-team="SRH"><span>Sunrisers Hyderabad</span></button>
                <button class="team" data-team="RR"><span>Rajasthan Royals</span></button>
                <button class="team" data-team="DC"><span>Delhi Capitals</span></button>
                <button class="team" data-team="PBKS"><span>Punjab Kings</span></button>
                <button class="team" data-team="GT"><span>Gujarat Titans</span></button>
                <button class="team" data-team="LSG"><span>Lucknow Super Giants</span></button>
            </section>

            <button id="startBtn" disabled>CONTINUE →</button>
        </section>

        <section id="auction-section" hidden>


            <div class="auction-layout">
                <div class="auction-main">
                    <div id="current-player"></div>
                </div>

                <div class="auction-controls">
                    <p id="timer-display">5s</p>

                    <button id="bidBtn">🔨 Place Bid</button>

                    <div class="secondary-controls">
                        <button id="pauseBtn">⏸️</button>
                        <button id="viewSquadBtn">View Squad</button>
                    </div>

                    <p id="current-bid"></p>

                    <div id="squad-box" hidden>
                        <h3 id="squad-title">Team Squad</h3>
                        <p id="squad-budget"></p>
                        <div id="squad-players"></div>
                        <button id="closeSquadBtn">Close Squad</button>
                    </div>
                </div>
            </div>

            <p id="auction-message"></p>
        </section>
    </main>
    <footer>
        <a href="https://github.com/4ev3rdk/ipl-auction-game/">
            <img src="./images/github-142-svgrepo-com.svg" alt="GitHub"> </a>
        <span>&nbsp;@4e3rdk</span>

    </footer>
</body>

</html>
