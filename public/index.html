<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL Auction Simulator</title>
    <link rel="stylesheet" href="styles.css">
    <script src="./js.js" defer></script>
</head>

<body>
    <header>
        <h1>IPL AUCTION</h1>
        <p>BUILD YOUR LEGACY</p>
    </header>

    <main class="container">
        <h2>Select Your Franchise</h2>
        <p class="subtitle">Choose your team and take charge of the auction.</p>

        <section class="teams">
            <button class="team" data-team="CSK">🟡<span>Chennai Super Kings</span></button>
            <button class="team" data-team="MI">🔵<span>Mumbai Indians</span></button>
            <button class="team" data-team="RCB">🔴<span>Royal Challengers Bengaluru</span></button>
            <button class="team" data-team="KKR">🟣<span>Kolkata Knight Riders</span></button>
            <button class="team" data-team="SRH">🟠<span>Sunrisers Hyderabad</span></button>
            <button class="team" data-team="RR">🩷<span>Rajasthan Royals</span></button>
            <button class="team" data-team="DC">🔷<span>Delhi Capitals</span></button>
            <button class="team" data-team="PBKS">❤️<span>Punjab Kings</span></button>
            <button class="team" data-team="GT">🔷<span>Gujarat Titans</span></button>
            <button class="team" data-team="LSG">🩵<span>Lucknow Super Giants</span></button>
        </section>

        <button id="startBtn" disabled>SELECT A TEAM TO CONTINUE →</button>
    </main>

    <script src="script.js"></script>
</body>

</html>
